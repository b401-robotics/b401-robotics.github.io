name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or your default branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install && (cd services/chatbot-worker && bun install)

      - name: Typecheck
        run: bunx tsc --noEmit && (cd services/chatbot-worker && bunx tsc --noEmit)

      - name: Run tests
        run: bun test services/chatbot-worker/src/chatbot.test.ts

      - name: Build project
        env:
          VITE_CHATBOT_API_URL: ${{ secrets.VITE_CHATBOT_API_URL || vars.VITE_CHATBOT_API_URL }}
        run: bun run build # Ensure your package.json has a build script

      - name: Verify editor excluded from deploy
        run: bun run tools/content-editor/scripts/assertNotDeployed.ts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # The directory containing your static files

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
