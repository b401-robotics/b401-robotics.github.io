<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>B401 Robotics &amp; Intelligent Systems Laboratory</title>
    <!--
      GitHub Pages SPA redirect.
      Any unknown path (e.g. /en/research) is rewritten to
      /?/en/research so GitHub Pages serves index.html, and the
      restore script in src/index.html turns the query string back
      into the real path before React Router boots.
      segmentCount = 0 because this is a user/org site served at the
      domain root (b401-robotics.github.io), not a project site.
      Adapted from https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
